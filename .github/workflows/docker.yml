name: Build and Push Docker Images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push lux-testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            luxfi/lux-testing:master
            luxfi/lux-testing:latest
      
      - name: Build and push lux-byzantine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.byzantine
          push: true
          tags: |
            luxfi/lux-byzantine:master
            luxfi/lux-byzantine:latest
